name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create release
    runs-on: windows-latest

    steps:
      - name: Get the source
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore packages
        run: dotnet restore Pompom.sln

      - name: Run unit tests
        run: dotnet test Pompom.sln --configuration Release --no-restore

      - name: Build the portable package
        shell: pwsh
        run: ./scripts/publish.ps1

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/Pompom-win-x64.zip
